name: BrushViewQL

settings:
  base:
    # ── Placeholders: set these before the first signed build ──────────────
    BUNDLE_ID_PREFIX: io.github.smonist
    DEVELOPMENT_TEAM: ""                 # your Apple team ID
    CODE_SIGN_IDENTITY: "-"              # "-" = Sign to Run Locally; "Apple Development" once a team is set
    # ───────────────────────────────────────────────────────────────────────
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  ABRKit:
    path: ABRKit

targets:
  BrushViewQL:
    type: application
    platform: macOS
    sources:
      - App
      - Preview/BrushGrid.swift
    dependencies:
      - package: ABRKit
      - target: BrushViewQLPreview
      - target: BrushViewQLThumbnail
    settings:
      PRODUCT_NAME: BrushViewQL Revitalized
      PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).BrushViewQLRevitalized
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.graphics-design
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.adobe.photoshop.brush
            UTTypeDescription: Photoshop Brush
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [abr]

  BrushViewQLPreview:
    type: app-extension
    platform: macOS
    sources: [Preview]
    dependencies:
      - package: ABRKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).BrushViewQLRevitalized.Preview
    entitlements:
      path: Preview/Preview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: Preview/Info.plist
      properties:
        CFBundleDisplayName: BrushViewQL Revitalized Preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes: [com.adobe.photoshop.brush]

  BrushViewQLThumbnail:
    type: app-extension
    platform: macOS
    sources: [Thumbnail]
    dependencies:
      - package: ABRKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).BrushViewQLRevitalized.Thumbnail
    entitlements:
      path: Thumbnail/Thumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: BrushViewQL Revitalized Thumbnail
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLThumbnailMinimumDimension: 0
            QLSupportedContentTypes: [com.adobe.photoshop.brush]
